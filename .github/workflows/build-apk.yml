name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --include=dev
      - run: npm run articles:build && npm run build
      - run: npx cap sync android
      - name: Bump versionCode per build (Obtainium detects updates by versionCode)
        run: |
          cd android
          RUN=${{ github.run_number }}
          TODAY=$(date +%Y.%m.%d)
          sed -i -E "s/versionCode [0-9]+/versionCode $RUN/; s/versionName \"[^\"]+\"/versionName \"$TODAY ($RUN)\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /home/runner/magnus-profectus.keystore || true
          if [ -s /home/runner/magnus-profectus.keystore ]; then
            echo "ANDROID_KEYSTORE_FILE=/home/runner/magnus-profectus.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          else
            echo "No signing keystore configured, the APK will be debug-signed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: /home/runner/magnus-profectus.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk magnus-profectus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: magnus-profectus-apk
          path: magnus-profectus.apk
      - name: Publish to the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.run_number }})
          body: Build ${{ github.run_number }}, ${{ github.event.head_commit.timestamp }}
          files: magnus-profectus.apk
          make_latest: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
